<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Güzergah</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Güzergah">
<meta name="theme-color" content="#0E5C58">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0E5C58;
    --navy-soft:#1C8C82;
    --amber:#C9A227;
    --amber-dark:#8C6E10;
    --amber-tint:#F7EFD6;
    --bg:#F5F3EC;
    --card:#FFFFFF;
    --border:#E1DFD3;
    --text:#0E4643;
    --text-soft:#6B7A78;
    --danger:#B3432B;
    --radius:10px;
  }
  html[data-theme="dark"]{
    --navy:#3FBDB2;
    --navy-soft:#2E8F86;
    --amber:#E4BE4E;
    --amber-dark:#F0CE6E;
    --amber-tint:#3A331A;
    --bg:#10201F;
    --card:#17302E;
    --border:#294644;
    --text:#EAF3F1;
    --text-soft:#93A8A5;
    --danger:#E07A5F;
  }
  html[data-theme="dark"] .school-chip{ background:#0F1F1E; }
  html[data-theme="dark"] input[type=text]{ background:#0F1F1E; color:var(--text); }
  html[data-theme="dark"] .file-label{ background:#0F1F1E; }
  html[data-theme="dark"] .service-chip{ background:#0F1F1E; }
  html[data-theme="dark"] .student-row{ background:#0F1F1E; }
  html[data-theme="dark"] .detail{ background:#0F1F1E; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  #app{max-width:960px; margin:0 auto; padding:20px 16px 60px;}
  .app-header{ display:flex; align-items:center; gap:12px; margin-bottom:2px; }
  .app-header img{ width:38px; height:38px; border-radius:50%; flex-shrink:0; }
  .app-header .title-wrap{ flex:1; min-width:0; }
  .app-header .header-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1.5px solid var(--border);
    background:var(--card); color:var(--navy); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:17px; flex-shrink:0; padding:0;
  }
  .icon-btn:active{ transform:scale(0.94); }
  h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-0.01em; color:var(--navy);}
  .subtitle{color:var(--text-soft); font-size:13.5px; margin:6px 0 20px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }
  .section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--navy-soft); margin:0 0 12px;}
  .school-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .school-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--bg); border:1.5px solid var(--border); border-radius:999px;
    padding:8px 8px 8px 14px; cursor:pointer; font-size:14px; font-weight:600;
    transition:border-color .15s, background .15s;
  }
  .school-chip.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .school-chip .count{ font-weight:400; font-size:12px; opacity:0.7; }
  .school-chip .del{
    width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.06); font-size:12px; line-height:1; color:inherit;
  }
  .school-chip.active .del{ background:rgba(255,255,255,0.2); }
  .add-school-btn{
    display:flex; align-items:center; gap:6px;
    background:transparent; border:1.5px dashed var(--border); border-radius:999px;
    padding:8px 16px; cursor:pointer; font-size:14px; font-weight:600; color:var(--navy-soft);
  }
  .add-school-btn:hover{ border-color:var(--navy-soft); }
  .add-form{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    background:var(--bg); border-radius:var(--radius); padding:12px; margin-top:4px;
  }
  input[type=text]{
    padding:9px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:14px;
    background:#fff; color:var(--text); flex:1; min-width:140px;
  }
  input[type=text]:focus{ outline:none; border-color:var(--navy-soft); }
  .btn{
    border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600;
    cursor:pointer; background:var(--navy); color:#fff;
  }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn.secondary{ background:transparent; border:1.5px solid var(--border); color:var(--text); }
  .file-label{
    border:1.5px solid var(--border); border-radius:8px; padding:9px 14px; font-size:14px;
    cursor:pointer; background:#fff; color:var(--navy-soft); font-weight:600; white-space:nowrap;
  }
  .file-label input{ display:none; }
  .tabs{ display:flex; gap:4px; margin-bottom:16px; border-bottom:2px solid var(--border); }
  .tab{
    padding:10px 4px; margin-right:20px; font-size:14.5px; font-weight:700; color:var(--text-soft);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px;
  }
  .tab.active{ color:var(--navy); border-bottom-color:var(--amber-dark); }
  .empty{ text-align:center; padding:40px 20px; color:var(--text-soft); font-size:14px; }
  .empty b{ color:var(--text); display:block; font-size:15px; margin-bottom:4px; }
  .service-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .service-chip{
    border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:9px 14px;
    font-size:14px; font-weight:700; cursor:pointer; color:var(--navy);
  }
  .service-chip .n{ font-weight:400; font-size:12px; color:var(--text-soft); margin-left:6px; }
  .service-chip.active{ background:var(--amber-tint); border-color:var(--amber-dark); }
  .search-box{ position:relative; margin-bottom:16px; }
  .search-box input{ width:100%; padding:12px 14px; font-size:15px; }
  .student-list{ display:flex; flex-direction:column; gap:8px; }
  .student-row{
    border:1px solid var(--border); border-radius:8px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    cursor:pointer; background:#fff;
  }
  .student-row:hover{ border-color:var(--navy-soft); }
  .s-name{ font-weight:700; font-size:14.5px; }
  .s-meta{ font-size:12.5px; color:var(--text-soft); margin-top:2px; }
  .s-badge{
    background:var(--amber-tint); color:var(--amber-dark); font-weight:700; font-size:12.5px;
    padding:4px 10px; border-radius:6px; white-space:nowrap;
  }
  .detail{
    border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-top:12px; background:#fff;
  }
  .detail-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row .k{ color:var(--text-soft); }
  .detail-row .v{ font-weight:600; text-align:right; max-width:65%; }
  .err{ color:var(--danger); font-size:13px; margin-top:6px; }
  .status{ font-size:12.5px; color:var(--text-soft); margin-top:8px; }
  .summary-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .summary-item{ background:var(--bg); border-radius:8px; padding:10px 12px; }
  .summary-item .num{ font-size:20px; font-weight:700; color:var(--navy); }
  .summary-item .lbl{ font-size:12px; color:var(--text-soft); margin-top:2px; }
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; top:0; left:0; width:100%; color:#000; }
  }
</style>
</head>

<script>
(function(){
  var STORAGE_KEY = 'servis-takip-okullar';
  var DRIVER_KEY = 'servis-takip-soforler';
  var storageAvailable = true;
  var state = {
    schools: {},
    drivers: {},
    activeSchool: null,
    mode: 'ara',
    activeService: null,
    search: '',
    mahalleSearch: '',
    showAddForm: false,
    showAddStudentForm: false,
    kayitOpen: false,
    kayitSelected: null,
    loaded: false
  };

  function normalize(s){
    return (s === null || s === undefined) ? '' : s.toString().toLocaleLowerCase('tr').trim();
  }

  function turkishIncludes(hay, needle){
    return normalize(hay).indexOf(needle) !== -1;
  }

  function hasClaudeStorage(){
    return typeof window.storage !== 'undefined';
  }

  function hasLocalStorage(){
    try{
      var t = '__servis_takip_test__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return true;
    }catch(e){
      return false;
    }
  }

  async function storageGet(key){
    if(hasClaudeStorage()){
      var res = await window.storage.get(key, false);
      return res ? res.value : null;
    }
    if(hasLocalStorage()){
      return window.localStorage.getItem(key);
    }
    return null;
  }

  async function storageSet(key, value){
    if(hasClaudeStorage()){
      await window.storage.set(key, value, false);
      return;
    }
    if(hasLocalStorage()){
      window.localStorage.setItem(key, value);
      return;
    }
    throw new Error('no storage');
  }

  async function loadState(){
    if(hasClaudeStorage() || hasLocalStorage()){
      try{
        var v1 = await storageGet(STORAGE_KEY);
        if(v1) state.schools = JSON.parse(v1);
      }catch(e){
        state.schools = {};
      }
      try{
        var v2 = await storageGet(DRIVER_KEY);
        if(v2) state.drivers = JSON.parse(v2);
      }catch(e){
        state.drivers = {};
      }
    } else {
      storageAvailable = false;
    }
    state.loaded = true;
    ensureStudentIds();
    var keys = Object.keys(state.schools);
    if(keys.length) state.activeSchool = keys[0];
    render();
  }

  async function persist(){
    if(!storageAvailable) { render(); return; }
    try{
      await storageSet(STORAGE_KEY, JSON.stringify(state.schools));
    }catch(e){
      storageAvailable = false;
      render();
    }
  }

  async function persistDrivers(){
    if(!storageAvailable) { render(); return; }
    try{
      await storageSet(DRIVER_KEY, JSON.stringify(state.drivers));
    }catch(e){
      storageAvailable = false;
      render();
    }
  }

  function getDriver(schoolName, service){
    if(state.drivers[schoolName] && state.drivers[schoolName][service]){
      return state.drivers[schoolName][service];
    }
    return {ad:'', tel:'', saat:''};
  }

  function setDriver(schoolName, service, ad, tel, saat){
    if(!state.drivers[schoolName]) state.drivers[schoolName] = {};
    state.drivers[schoolName][service] = {ad: ad.trim(), tel: tel.trim(), saat: (saat||'').trim()};
    persistDrivers();
  }

  function moveStudent(fromSchool, studentId, toSchool, toServis){
    var srcSchool = state.schools[fromSchool];
    if(!srcSchool) return null;
    var idx = srcSchool.students.findIndex(function(s){ return s.id === studentId; });
    if(idx === -1) return null;
    var student = srcSchool.students[idx];
    var newServis = (toServis||'').trim() || '(Belirtilmemiş)';
    if(toSchool === fromSchool){
      student.servis = newServis;
      persist();
      return student;
    }
    srcSchool.students.splice(idx, 1);
    student.servis = newServis;
    if(!state.schools[toSchool]) return null;
    state.schools[toSchool].students.push(student);
    persist();
    return student;
  }

  function telHref(tel){
    var digits = (tel||'').replace(/[^0-9+]/g, '');
    if(digits.indexOf('+') === 0){
      return 'tel:' + digits;
    }
    if(digits.length === 10 && digits.charAt(0) === '5'){
      digits = '0' + digits;
    }
    return 'tel:' + digits;
  }

  function esc(str){
    return (str === null || str === undefined ? '' : str.toString())
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function exportBackup(){
    var data = {
      exportedAt: new Date().toISOString(),
      schools: state.schools,
      drivers: state.drivers
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'guzergah-yedek-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  function parseSinifSube(raw){
    var s = (raw||'').toString().trim();
    if(!s) return {sinif:'', sube:''};
    s = s.replace(/sınıf/gi,'').replace(/sinif/gi,'').trim();
    s = s.replace(/\.+$/,'').trim();
    s = s.replace(/\s+/g,' ');
    if(!s) return {sinif:'', sube:''};
    var m = s.match(/^(hazırlık|hazirlik|\d+)\s*[-\/\s]?\s*([a-zA-ZçÇğĞıİöÖşŞüÜ]{0,3})$/i);
    if(m){
      var grade = m[1];
      var branch = m[2] ? m[2].toLocaleUpperCase('tr') : '';
      if(/^haz/i.test(grade)) grade = 'Hazırlık';
      return {sinif: grade, sube: branch};
    }
    return {sinif: s, sube: ''};
  }

  function splitFullName(full){
    var s = (full||'').toString().trim().replace(/\s+/g,' ');
    if(!s) return {adi:'', soyadi:''};
    var parts = s.split(' ');
    if(parts.length === 1) return {adi: parts[0], soyadi:''};
    var soyadi = parts.pop();
    return {adi: parts.join(' '), soyadi: soyadi};
  }

  function pickBestServisIndex(rows, candidateIndices){
    if(candidateIndices.length <= 1) return candidateIndices[0];
    var scored = candidateIndices.map(function(idx){
      var numericCount = 0, total = 0;
      for(var r = 1; r < Math.min(rows.length, 40); r++){
        var v = rows[r] && rows[r][idx];
        if(v === undefined || v === null || v === '') continue;
        total++;
        if(/^\d+$/.test(v.toString().trim())) numericCount++;
      }
      return {idx: idx, ratio: total ? (numericCount/total) : 0};
    });
    scored.sort(function(a,b){ return b.ratio - a.ratio; });
    return scored[0].idx;
  }

  function parseWorkbookToStudents(workbook){
    var sheetName = workbook.SheetNames[0];
    var sheet = workbook.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    if(!rows.length) throw new Error('Dosya boş görünüyor.');
    var headers = rows[0];
    var colMap = {};
    var telIndices = [];
    var servisIndices = [];
    headers.forEach(function(h, i){
      var n = normalize(h);
      if(n.indexOf('sınıf') !== -1 || n.indexOf('sinif') !== -1){ colMap.sinif = i; }
      else if(n.indexOf('şube') !== -1 || n.indexOf('sube') !== -1){ colMap.sube = i; }
      else if(n === 'no'){ colMap.no = i; }
      else if(n.indexOf('soyad') !== -1){ colMap.soyadi = i; }
      else if((n.indexOf('öğrenci') !== -1 || n.indexOf('ogrenci') !== -1) && colMap.fullName === undefined){ colMap.fullName = i; }
      else if((n.indexOf('adı') !== -1 || n.indexOf('adi') !== -1 || n === 'ad') && colMap.adi === undefined){ colMap.adi = i; }
      else if(n.indexOf('servis') !== -1){ servisIndices.push(i); }
      else if(n.indexOf('adres') !== -1){ colMap.adres = i; }
      else if(n.indexOf('tel') !== -1 || n.indexOf('gsm') !== -1){ telIndices.push(i); }
      else if(n.indexOf('meslek') !== -1){ /* meslek sütunları görmezden gelinir */ }
      else if(n.indexOf('anne') !== -1 && colMap.anne === undefined){ colMap.anne = i; }
      else if(n.indexOf('baba') !== -1 && colMap.baba === undefined){ colMap.baba = i; }
    });

    if(servisIndices.length){
      colMap.servis = pickBestServisIndex(rows, servisIndices);
    }

    var hasNameCols = colMap.adi !== undefined && colMap.soyadi !== undefined;
    var hasFullNameCol = colMap.fullName !== undefined;
    if((!hasNameCols && !hasFullNameCol) || colMap.servis === undefined){
      throw new Error('Dosyada Adı/Soyadı (veya Öğrenci) ve Servis sütunları bulunamadı. Sütun başlıklarını kontrol edin.');
    }

    var anneTelIdx, babaTelIdx;
    if(telIndices.length){
      if(colMap.anne !== undefined){
        var afterAnne = telIndices.filter(function(t){ return t > colMap.anne; }).sort(function(a,b){return a-b;});
        anneTelIdx = afterAnne[0];
      }
      if(colMap.baba !== undefined){
        var afterBaba = telIndices.filter(function(t){ return t > colMap.baba; }).sort(function(a,b){return a-b;});
        babaTelIdx = afterBaba[0];
      }
      if(anneTelIdx === undefined && telIndices[0] !== undefined) anneTelIdx = telIndices[0];
      if(babaTelIdx === undefined && telIndices[1] !== undefined) babaTelIdx = telIndices[1];
    }

    var students = [];
    for(var r = 1; r < rows.length; r++){
      var row = rows[r];
      if(!row || !row.length) continue;
      var get = function(idx){ return idx !== undefined && row[idx] !== undefined ? row[idx].toString().trim() : ''; };

      var adi, soyadi;
      if(hasNameCols){
        adi = get(colMap.adi);
        soyadi = get(colMap.soyadi);
      } else {
        var np = splitFullName(get(colMap.fullName));
        adi = np.adi;
        soyadi = np.soyadi;
      }
      if(!adi && !soyadi) continue;

      var sinifVal, subeVal;
      if(colMap.sube !== undefined){
        sinifVal = get(colMap.sinif);
        subeVal = get(colMap.sube);
      } else {
        var sp = parseSinifSube(get(colMap.sinif));
        sinifVal = sp.sinif;
        subeVal = sp.sube;
      }

      students.push({
        id: genId(),
        sinif: sinifVal,
        sube: subeVal,
        no: get(colMap.no),
        adi: adi,
        soyadi: soyadi,
        servis: get(colMap.servis) || '(Belirtilmemiş)',
        adres: get(colMap.adres),
        anneAdi: get(colMap.anne),
        anneTel: get(anneTelIdx),
        babaAdi: get(colMap.baba),
        babaTel: get(babaTelIdx)
      });
    }
    if(!students.length) throw new Error('Dosyada öğrenci satırı bulunamadı.');
    return students;
  }

  function handleFile(schoolName, file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array'});
        var students = parseWorkbookToStudents(wb);
        state.schools[schoolName] = {
          fileName: file.name,
          uploadedAt: new Date().toISOString(),
          students: students
        };
        state.activeSchool = schoolName;
        state.showAddForm = false;
        persist();
        render();
      }catch(err){
        showAddError(err.message || 'Dosya okunamadı.');
      }
    };
    reader.onerror = function(){ showAddError('Dosya okunamadı.'); };
    reader.readAsArrayBuffer(file);
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'text') e.textContent = attrs[k];
      else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }

      onclick: function(){
        var targetSchool = schoolSelect.value;
        var targetServis = servisInput.value.trim();
        if(!targetServis){
          pendingMoveError = 'Servis numarası girin.';
          wrap.appendChild(el('div', {class:'err', text:pendingMoveError}));
          return;
        }
        moveStudent(schoolName, s.id, targetSchool, targetServis);
        container.innerHTML = '';
        render();
      }
    });
    var cancelBtn = el('button', {
      class:'btn secondary',
      text:'Vazgeç',
      onclick: function(){ wrap.innerHTML = ''; }
    });

    wrap.appendChild(el('div', {class:'add-form'}, [schoolSelect, servisInput, moveBtn, cancelBtn]));
    return wrap;
  }

  function renderServisMode(wrap){
    var school = state.schools[state.activeSchool];
    if(!school){ state.activeSchool = Object.keys(state.schools)[0]; school = state.schools[state.activeSchool]; }

    var card = el('div', {class:'card'});
    card.appendChild(el('div', {class:'section-title', text: state.activeSchool + ' — Servis No Seçin'}));

    var services = {};
    school.students.forEach(function(s){
      services[s.servis] = (services[s.servis]||0) + 1;
    });
    var serviceKeys = Object.keys(services).sort(function(a,b){
      var na = parseFloat(a), nb = parseFloat(b);
      if(!isNaN(na) && !isNaN(nb)) return na - nb;
      return a.localeCompare(b, 'tr');
    });

    var chipRow = el('div', {class:'service-chips'});
    serviceKeys.forEach(function(k){
      var drvK = getDriver(state.activeSchool, k);
      var chip = el('div', {
        class:'service-chip' + (state.activeService === k ? ' active' : ''),
        onclick: function(){ state.activeService = (state.activeService===k? null : k); render(); }
      }, [
        document.createTextNode('Servis ' + k),
        el('span', {class:'n', text: services[k] + ' öğrenci' + (drvK.ad ? '  ·  ' + drvK.ad : '')})
      ]);
      chipRow.appendChild(chip);
    });
    card.appendChild(chipRow);
    wrap.appendChild(card);

    if(state.activeService){
      var drv = getDriver(state.activeSchool, state.activeService);

      var drvCard = el('div', {class:'card'});
      drvCard.appendChild(el('div', {class:'section-title', text:'Servis ' + state.activeService + ' — Şoför Bilgisi'}));
      var drvNameInput = el('input', {type:'text', placeholder:'Şoför adı soyadı'});
      drvNameInput.value = drv.ad;
      var drvTelInput = el('input', {type:'text', placeholder:'Telefon numarası'});
      drvTelInput.value = drv.tel;
      var drvSaatInput = el('input', {type:'text', placeholder:'Kalkış saati (örn. 07:15)', style:'max-width:170px;'});
      drvSaatInput.value = drv.saat;
      var drvSaveBtn = el('button', {
        class:'btn',
        text:'Kaydet',
        onclick: function(){
          setDriver(state.activeSchool, state.activeService, drvNameInput.value, drvTelInput.value, drvSaatInput.value);
          render();
        }
      });
      drvCard.appendChild(el('div', {class:'add-form'}, [drvNameInput, drvTelInput, drvSaatInput, drvSaveBtn]));
      if(drv.tel){
        drvCard.appendChild(el('a', {href: telHref(drv.tel), class:'btn secondary', style:'display:inline-block; margin-top:10px; text-decoration:none;', text:'Şoförü Ara'}));
      }
      wrap.appendChild(drvCard);

      var list = school.students.filter(function(s){ return s.servis === state.activeService; })
        .sort(function(a,b){ return (a.adi+a.soyadi).localeCompare(b.adi+b.soyadi, 'tr'); });

      var listCard = el('div', {class:'card'});
      var listHeader = el('div', {style:'display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;'}, [
        el('div', {class:'section-title', text:'Servis ' + state.activeService + ' — ' + list.length + ' öğrenci', style:'margin-bottom:0;'}),
        el('div', {style:'display:flex; gap:8px;'}, [
          el('button', {class:'btn secondary', text:'Excel', onclick: function(){ exportServiceExcel(state.activeSchool, state.activeService, list, drv); }}),
          el('button', {class:'btn secondary', text:'Yazdır', onclick: function(){ printService(state.activeSchool, state.activeService, list, drv); }})
        ])
      ]);
      listCard.appendChild(listHeader);
      var listWrap = el('div', {class:'student-list'});
      list.forEach(function(s){
        var row = el('div', {
          class:'student-row',
          onclick: function(){
            var detailHolder = document.getElementById('detailHolder');
            renderStudentDetail(detailHolder, s, state.activeSchool);
            detailHolder.scrollIntoView({behavior:'smooth', block:'nearest'});
          }
        }, [
          el('div', {}, [
            el('div', {class:'s-name', text: s.adi + ' ' + s.soyadi}),
            el('div', {class:'s-meta', text: studentLabel(s) + (s.no ? '  ·  No ' + s.no : '')})
          ]),
          el('div', {class:'s-badge', text:'Servis ' + s.servis})
        ]);
        listWrap.appendChild(row);
      });
      listCard.appendChild(listWrap);
      wrap.appendChild(listCard);
      wrap.appendChild(el('div', {id:'detailHolder'}));
    }
  }

  function renderAraMode(wrap){
    var school = state.schools[state.activeSchool];
    if(!school){ state.activeSchool = Object.keys(state.schools)[0]; school = state.schools[state.activeSchool]; }

    var card = el('div', {class:'card'});
    var searchBox = el('div', {class:'search-box'});
    var input = el('input', {type:'text', placeholder:'Öğrenci adı veya soyadı yazın...'});
    input.value = state.search;
    input.addEventListener('input', function(){
      state.search = input.value;
      renderSearchResults();
    });
    searchBox.appendChild(input);
    card.appendChild(el('div', {class:'section-title', text: state.activeSchool + ' İçinde Ara'}));
    card.appendChild(searchBox);
    card.appendChild(el('div', {id:'searchResults'}));
    wrap.appendChild(card);
    wrap.appendChild(el('div', {id:'detailHolder'}));
    renderSearchResults();

    setTimeout(function(){ input.focus(); }, 0);
  }

  function renderSearchResults(){
    var resWrap = document.getElementById('searchResults');
    if(!resWrap) return;
    resWrap.innerHTML = '';
    var school = state.schools[state.activeSchool];
    if(!school) return;
    var q = normalize(state.search);
    var matches = [];
    school.students.forEach(function(s){
      var full = normalize(s.adi + ' ' + s.soyadi);
      if(!q || full.indexOf(q) !== -1){
        matches.push({s:s, school:state.activeSchool});
      }
    });
    matches.sort(function(a,b){
      return (a.s.adi+a.s.soyadi).localeCompare(b.s.adi+b.s.soyadi, 'tr');
    });
    if(!matches.length){
      resWrap.appendChild(el('div', {class:'empty', text: q ? 'Eşleşen öğrenci bulunamadı.' : 'Henüz öğrenci yok.'}));
      return;
    }
    resWrap.appendChild(el('div', {class:'status', text: matches.length + ' öğrenci'}));
    var listWrap = el('div', {class:'student-list'});
    matches.forEach(function(m){
      var row = el('div', {
        class:'student-row',
        onclick: function(){
          var detailHolder = document.getElementById('detailHolder');
          renderStudentDetail(detailHolder, m.s, m.school);
          detailHolder.scrollIntoView({behavior:'smooth', block:'nearest'});
        }
      }, [
        el('div', {}, [
          el('div', {class:'s-name', text: m.s.adi + ' ' + m.s.soyadi}),
          el('div', {class:'s-meta', text: m.school + '  ·  ' + studentLabel(m.s)})
        ]),
        el('div', {class:'s-badge', text:'Servis ' + m.s.servis})
      ]);
      listWrap.appendChild(row);
    });
    resWrap.appendChild(listWrap);
  }

  function renderMahalleMode(wrap){
    var card = el('div', {class:'card'});
    var searchBox = el('div', {class:'search-box'});
    var input = el('input', {type:'text', placeholder:'Mahalle veya adres yazın (örn. Hocacihan)...'});
    input.value = state.mahalleSearch;
    input.addEventListener('input', function(){
      state.mahalleSearch = input.value;
      renderMahalleResults();
    });
    searchBox.appendChild(input);
    card.appendChild(el('div', {class:'section-title', text: state.activeSchool + ' — Adrese Göre Servis Bul'}));
    card.appendChild(searchBox);
    card.appendChild(el('div', {id:'mahalleResults'}));
    wrap.appendChild(card);
    wrap.appendChild(el('div', {id:'detailHolder'}));
    renderMahalleResults();

    setTimeout(function(){ input.focus(); }, 0);
  }

  function renderMahalleResults(){
    var resWrap = document.getElementById('mahalleResults');
    if(!resWrap) return;
    resWrap.innerHTML = '';
    var q = normalize(state.mahalleSearch);
    if(!q){
      resWrap.appendChild(el('div', {class:'empty', text:'Bir mahalle veya adres yazarak hangi servislerin oraya gittiğini görün.'}));
      return;
    }
    var school = state.schools[state.activeSchool];
    if(!school) return;
    var matches = [];
    school.students.forEach(function(s){
      if(normalize(s.adres).indexOf(q) !== -1){
        matches.push({s:s, school:state.activeSchool});
      }
    });
    if(!matches.length){
      resWrap.appendChild(el('div', {class:'empty', text:'Bu adreste öğrenci bulunamadı.'}));
      return;
    }

    var groups = {};
    var groupOrder = [];
    matches.forEach(function(m){
      var key = m.school + '||' + m.s.servis;
      if(!groups[key]){
        groups[key] = {school: m.school, servis: m.s.servis, students: []};
        groupOrder.push(key);
      }
      groups[key].students.push(m.s);
    });

    resWrap.appendChild(el('div', {class:'status', text: groupOrder.length + ' servis, ' + matches.length + ' öğrenci eşleşti'}));

    groupOrder.forEach(function(key){
      var g = groups[key];
      var drv = getDriver(g.school, g.servis);
      var groupCard = el('div', {class:'detail', style:'margin-bottom:14px;'});
      groupCard.appendChild(el('div', {class:'detail-row'}, [
        el('span', {class:'k', text:'Servis ' + g.servis}),
        el('span', {class:'v', text: g.students.length + ' öğrenci'})
      ]));
      groupCard.appendChild(el('div', {class:'detail-row'}, [
        el('span', {class:'k', text:'Şoför'}),
        el('span', {class:'v', text: drv.ad || drv.tel ? (drv.ad||'-') + (drv.tel ? '  ·  ' + drv.tel : '') : 'Girilmemiş'})
      ]));
      var listWrap = el('div', {class:'student-list', style:'margin-top:10px;'});
      g.students.sort(function(a,b){ return (a.adi+a.soyadi).localeCompare(b.adi+b.soyadi, 'tr'); }).forEach(function(s){
        var row = el('div', {
          class:'student-row',
          onclick: function(){
            var detailHolder = document.getElementById('detailHolder');
            renderStudentDetail(detailHolder, s, g.school);
            detailHolder.scrollIntoView({behavior:'smooth', block:'nearest'});
          }
        }, [
          el('div', {}, [
            el('div', {class:'s-name', text: s.adi + ' ' + s.soyadi}),
            el('div', {class:'s-meta', text: s.adres})
          ])
        ]);
        listWrap.appendChild(row);
      });
      groupCard.appendChild(listWrap);
      resWrap.appendChild(groupCard);
    });
  }

      el('div', {class:'section-title', text:'Yeni Öğrenci Servis Kaydı', style:'margin-bottom:0;'}),
      el('button', {
        class:'btn secondary',
        text:'Kapat',
        onclick: function(){ state.kayitOpen = false; state.kayitSelected = null; render(); }
      })
    ]);
    wrap.appendChild(closeCard);

    if(!state.kayitSelected){
      var listCard = el('div', {class:'card'});
      listCard.appendChild(el('div', {class:'s-meta', style:'font-size:13.5px; margin-bottom:12px;', text:'Servise binmek isteyen yeni öğrencinin okulunu seçin, karekodu gösterin.'}));
      var listWrap = el('div', {class:'student-list'});
      KAYIT_SCHOOLS.forEach(function(sch){
        var row = el('div', {
          class:'student-row',
          onclick: function(){ state.kayitSelected = sch.name; render(); }
        }, [
          el('div', {}, [
            el('div', {class:'s-name', text: sch.name}),
            el('div', {class:'s-meta', text: sch.fullTitle})
          ])
        ]);
        listWrap.appendChild(row);
      });
      listCard.appendChild(listWrap);
      wrap.appendChild(listCard);
      return;
    }

    var sch = KAYIT_SCHOOLS.filter(function(s){ return s.name === state.kayitSelected; })[0];
    if(!sch){ state.kayitSelected = null; return; }

    var card = el('div', {class:'card'});
    card.appendChild(el('button', {
      class:'btn secondary',
      text:'← Okul Listesine Dön',
      style:'margin-bottom:14px;',
      onclick: function(){ state.kayitSelected = null; render(); }
    }));
    card.appendChild(el('div', {class:'section-title', text: sch.name}));
    card.appendChild(el('div', {class:'s-meta', style:'margin-bottom:10px;', text: sch.fullTitle}));
    var imgWrap = el('div', {style:'display:flex; justify-content:center; margin-bottom:10px;'});
    var img = el('img', {src: sch.img, alt: sch.name + ' servis kayıt karekodu', style:'width:100%; max-width:280px; border-radius:8px; border:1px solid var(--border);'});
    imgWrap.appendChild(img);
    card.appendChild(imgWrap);
    var link = el('a', {href: sch.url, target:'_blank', rel:'noopener', style:'display:block; text-align:center; color:var(--navy-soft); font-size:13px; word-break:break-all;', text: sch.url});
    card.appendChild(link);
    wrap.appendChild(card);
  }

  function renderStorageNote(){
    var note = document.getElementById('storageNote');
    if(!note) return;
    if(!storageAvailable && Object.keys(state.schools).length){
      note.innerHTML = '';
      note.appendChild(el('div', {
        style: 'background:var(--amber-tint); color:var(--amber-dark); font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; margin-bottom:14px;',
        text: 'Bu ortamda kalıcı depolama desteklenmiyor: yüklediğiniz okullar yalnızca bu oturumda görünür, sayfayı kapatırsanız yeniden yüklemeniz gerekir.'
      }));
    } else {
      note.innerHTML = '';
    }
  }

  function renderSummaryCard(){
    var summaryWrap = document.getElementById('summaryWrap');
    if(!summaryWrap) return;
    summaryWrap.innerHTML = '';
    if(state.kayitOpen) return;
    var school = state.schools[state.activeSchool];
    if(!school || !school.students.length) return;

    var services = {};
    school.students.forEach(function(s){
      services[s.servis] = (services[s.servis]||0) + 1;
    });
    var serviceKeys = Object.keys(services);

    var card = el('div', {class:'card'});
    card.appendChild(el('div', {class:'section-title', text: state.activeSchool + ' — Özet'}));
    var grid = el('div', {class:'summary-grid'});
    var items = [
      [school.students.length.toString(), 'Toplam öğrenci'],
      [serviceKeys.length.toString(), 'Servis sayısı']
    ];
    items.forEach(function(it){
      grid.appendChild(el('div', {class:'summary-item'}, [
        el('div', {class:'num', text: it[0]}),
        el('div', {class:'lbl', text: it[1]})
      ]));
    });
    card.appendChild(grid);
    summaryWrap.appendChild(card);
  }

  function render(){
    renderStorageNote();
    renderSchoolRow();
    renderSummaryCard();
    renderMain();
  }

  var THEME_KEY = 'servis-takip-tema';

  async function initTheme(){
    var theme = 'light';
    try{
      var v = await storageGet(THEME_KEY);
      if(v === 'dark' || v === 'light'){
        theme = v;
      } else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
        theme = 'dark';
      }
    }catch(e){}
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
  }

  function updateThemeIcon(theme){
    var btn = document.getElementById('themeToggleBtn');
    if(btn) btn.innerHTML = theme === 'dark' ? '&#9728;' : '&#9789;';
  }

  async function toggleTheme(){
    var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    updateThemeIcon(next);
    try{ await storageSet(THEME_KEY, next); }catch(e){}
  }

  document.getElementById('backupExportBtn').addEventListener('click', function(){
    exportBackup();
  });
  document.getElementById('backupImportInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(file) importBackupFile(file);
    e.target.value = '';
  });

  document.getElementById('kayitBtn').addEventListener('click', function(){
    state.kayitOpen = true;
    state.kayitSelected = null;
    render();
  });
  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
  document.getElementById('refreshBtn').addEventListener('click', function(){
    window.location.reload();
  });

  initTheme();
  loadState();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
